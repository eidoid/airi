name: Build and Cache Flake

on:
  push:
    branches: [iden]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v29
        with:
          # Enable flakes and nix-command
          nix_conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Setup Attic Cache
        # We use a community action to install and configure the attic client
        uses: ryanccn/attic-action@v0
        with:
          endpoint: ${{ secrets.ATTIC_ENDPOINT }}
          token: ${{ secrets.ATTIC_TOKEN }}
          cache: ${{ secrets.ATTIC_CACHE }}

      - name: Build Flake
        # Replace '.#your-package' with the specific output or just '.' for default
        run: |
          nix build .#default --print-build-logs

      - name: Push to Attic
        # 'my-cache' is the name of your specific cache on the Attic server
        run: |
          attic push ${{ secrets.ATTIC_CACHE }} ./result
